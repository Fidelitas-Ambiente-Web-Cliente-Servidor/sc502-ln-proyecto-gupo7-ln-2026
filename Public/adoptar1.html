<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoptar | Vida Rescate</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/adoptar1.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Vida Rescate Atenas</a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="principal.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Adoptar</a></li>
        <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
        <li class="nav-item"><a class="nav-link" href="crear.html">Registrar</a></li>
        <li class="nav-item"><a class="nav-link" href="donar1.html">Donaciones</a></li>
        <li class="nav-item"><a class="nav-link" href="voluntariado.html">Voluntariado</a></li>
        <li class="nav-item ms-3">
          <button class="btn btn-danger btn-sm">Cerrar Sesión</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<section class="page-header">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">
    <div>
      <h1>Adoptar</h1>
      <p>Animales disponibles en nuestro refugio</p>
    </div>

    <a href="registrar_mascota.html" class="btn-registrar">
      ➕ Registrar nueva mascota
    </a>
  </div>
</section>

<div class="container">
  <div class="buscador-section text-center">
    <h2>Buscar por nombre</h2>

    <div class="input-group mx-auto">
      <input id="buscarRaza" type="text" class="form-control" placeholder="Ej: Luna, Max...">
      <button id="btnBuscar" class="btn btn-success">Buscar</button>
      <button id="btnTodas" class="btn btn-secondary">Ver todas</button>
    </div>
  </div>
</div>

<div class="container animales-section">
  <p class="section-label">Animales disponibles</p>

  <div class="animales-grid" id="contenedorMascotas"></div>
</div>

<script>
const input = document.getElementById("buscarRaza");
const btnBuscar = document.getElementById("btnBuscar");
const btnTodas = document.getElementById("btnTodas");
const contenedor = document.getElementById("contenedorMascotas");

function cargarMascotas() {
  fetch("listar_mascotas.php")
    .then(res => res.text())
    .then(data => {
      contenedor.innerHTML = data;
    })
    .catch(() => {
      contenedor.innerHTML = "<p class='text-danger'>Error al cargar mascotas</p>";
    });
}

btnBuscar.addEventListener("click", () => {
  const valor = input.value;

  fetch("listar_mascotas.php?nombre=" + valor)
    .then(res => res.text())
    .then(data => {
      contenedor.innerHTML = data;
    });
});

btnTodas.addEventListener("click", () => {
  input.value = "";
  cargarMascotas();
});

window.onload = cargarMascotas;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
