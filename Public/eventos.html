<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos | Vida Rescate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #f0f4f8;
        font-family: 'Segoe UI', sans-serif;
    }

    .titulo {
        text-align: center;
        margin: 120px auto 40px;
    }

    .titulo h2 {
        font-size: 2rem;
        font-weight: 700;
        color: #8e44ad;
    }

    .titulo p {
        color: #888;
        font-size: 1.1rem;
    }

    .lista-eventos {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 20px 60px;
    }

    .evento-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        padding: 25px 30px;
        margin-bottom: 20px;
        border-left: 5px solid #8e44ad;
        transition: transform 0.3s;
    }

    .evento-card:hover {
        transform: translateX(5px);
    }

    .evento-card h5 {
        color: #8e44ad;
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .evento-card p {
        color: #555;
        margin-bottom: 10px;
        line-height: 1.6;
    }

    .evento-card .fecha {
        color: #aaa;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .sin-eventos {
        text-align: center;
        color: #888;
        font-size: 1.1rem;
        margin-top: 40px;
    }
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
<div class="container">
<a class="navbar-brand">Vida Rescate Atenas</a>
<div>
    <a href="principal.html" class="btn btn-secondary me-2">
        ⬅ Volver al Inicio
    </a>
    <button class="btn btn-danger" onclick="cerrarSesion()">
        Cerrar Sesión
    </button>
</div>
</div>
</nav>

<div class="titulo">
    <h2>📅 Eventos</h2>
    <p>Actividades y campañas organizadas por la asociación</p>
</div>

<div class="lista-eventos" id="listaEventos"></div>

<script src="js/eventos.js"></script>
</body>
</html>
