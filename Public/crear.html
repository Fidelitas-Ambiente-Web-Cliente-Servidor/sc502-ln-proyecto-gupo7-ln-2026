<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Evento | Vida Rescate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/crear_evento.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
<div class="container">
    <a class="navbar-brand">Vida Rescate Atenas</a>

    <div>
        <a href="principal.html" class="btn btn-secondary me-2">⬅ Volver al Inicio</a>
        <button class="btn btn-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</div>
</nav>

<div class="card-formulario">
    <h2>Registrar Nuevo Evento</h2>
    <p>Complete los campos para agregar un evento</p>

    <form id="eventoForm">

        <div class="mb-3">
            <label for="titulo">Título del evento</label>
            <input type="text" id="titulo" placeholder="Escribe el título" required>
        </div>

        <div class="mb-3">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" placeholder="Describe el evento" required></textarea>
        </div>

        <div class="mb-3">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
        </div>

        <button type="submit" id="btnGuardar">Guardar Evento</button>

    </form>
</div>

<script src="js/crear.js"></script>
</body>
</html>
